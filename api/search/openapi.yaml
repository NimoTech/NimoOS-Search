openapi: 3.0.3
info:
  title: NimoOS-Search API
  version: 0.1.0
  description: Retrieval API for NimoOS RAG layer. See design spec 2026-05-22-nimoos-search-design.md
servers:
  - url: http://localhost/v1/search
paths:
  /text:
    post:
      operationId: searchText
      summary: Text retrieval (BGE-M3 dense + sparse + rerank)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SearchResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /file:
    get:
      operationId: searchFile
      summary: List all chunks of a file (paginated)
      parameters:
        - { name: file_id, in: query, required: true, schema: { type: string } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FileChunksResponse' } } } }
        '404': { description: Not Found (not authorized OR not indexed) }
  /chunk:
    get:
      operationId: searchChunk
      summary: Fetch anchor chunk plus neighbor window
      parameters:
        - { name: file_id, in: query, required: true, schema: { type: string } }
        - { name: kind, in: query, required: true, schema: { type: string, enum: [body, ocr, caption, transcript, summary] } }
        - { name: chunk_no, in: query, required: true, schema: { type: integer } }
        - { name: window, in: query, required: false, schema: { type: integer, default: 2, maximum: 5 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChunkContextResponse' } } } }
        '404': { description: Not Found }
  /visual:
    post:
      operationId: searchVisual
      summary: Image search via Photos service (returns 503 when Photos unavailable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: Natural-language image search query
                top_k:
                  type: integer
                  default: 20
                  maximum: 100
                  description: Maximum number of image hits to return
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  images:
                    type: array
                    items: { $ref: '#/components/schemas/ImageHit' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /hybrid:
    post:
      operationId: searchHybrid
      summary: Hybrid retrieval (NOT YET IMPLEMENTED in MVP — returns 503)
      responses:
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /thumb/{file_id}:
    get:
      operationId: searchThumb
      summary: Thumbnail (NOT YET IMPLEMENTED in MVP — returns 404)
      parameters:
        - { name: file_id, in: path, required: true, schema: { type: string } }
      responses:
        '404': { description: Not Implemented in MVP }
  /agent/tools:
    get:
      operationId: agentTools
      summary: Return OpenAI function-calling schema for agent tools
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AgentToolsResponse' } } } }
  /agent/tool:
    post:
      operationId: agentToolInvoke
      summary: Unified tool dispatch (nimoos_search / read_file_chunk)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentInvocation' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /agent/filters-schema:
    get:
      operationId: agentFiltersSchema
      summary: Filter field documentation for the agent
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
  /_internal/health:
    get:
      operationId: internalHealth
      summary: Upstream connectivity check (localhost-only)
      responses:
        '200': { description: OK }
  /_internal/stats:
    get:
      operationId: internalStats
      summary: KPI snapshot (localhost-only)
      responses:
        '200': { description: OK }
  /_internal/warm:
    post:
      operationId: internalWarm
      summary: Warm up BGE-M3 + cache
      responses:
        '200': { description: OK }
components:
  schemas:
    Filters:
      type: object
      properties:
        root_ids: { type: array, items: { type: string } }
        mime_prefix: { type: array, items: { type: string } }
        kind_in: { type: array, items: { type: string } }
        lang_in: { type: array, items: { type: string } }
    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        filters: { $ref: '#/components/schemas/Filters' }
        top_k: { type: integer, default: 20, maximum: 100 }
        rerank: { type: boolean, default: true }
        include_neighbors: { type: boolean, default: false }
        group_by_file: { type: boolean, default: false }
        max_chunks_per_file: { type: integer, default: 5, maximum: 20 }
    Cite:
      type: object
      properties:
        page: { type: integer, nullable: true }
        offset_start: { type: integer, nullable: true }
        offset_end: { type: integer, nullable: true }
        frame_ms_start: { type: integer, nullable: true }
        frame_ms_end: { type: integer, nullable: true }
        chunk_no: { type: integer }
    Hit:
      type: object
      properties:
        score: { type: number }
        raw_score: { type: number }
        collection: { type: string }
        file_id: { type: string }
        paths:
          type: array
          items:
            type: object
            properties:
              root_id: { type: string }
              path: { type: string }
        mime: { type: string }
        kind: { type: string }
        cite: { $ref: '#/components/schemas/Cite' }
        preview:
          type: object
          properties:
            text: { type: string, nullable: true }
            thumbnail_url: { type: string, nullable: true }
        payload_extra: { type: object }
    SearchResponse:
      type: object
      properties:
        hits:
          type: array
          items: { $ref: '#/components/schemas/Hit' }
        files:
          type: array
          items: { $ref: '#/components/schemas/FileGroup' }
        stats:
          type: object
          properties:
            total_candidates: { type: integer }
            rerank_ms: { type: integer }
            embed_ms: { type: integer }
            vector_search_ms: { type: integer }
            expand_ms: { type: integer }
        warnings:
          type: array
          items: { type: string }
    FileChunksResponse:
      type: object
      properties:
        file_id: { type: string }
        chunks:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              chunk_no: { type: integer }
              text: { type: string }
              page: { type: integer, nullable: true }
              offset_start: { type: integer, nullable: true }
              offset_end: { type: integer, nullable: true }
              frame_ms_start: { type: integer, nullable: true }
              frame_ms_end: { type: integer, nullable: true }
        offset: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    ChunkContextResponse:
      type: object
      properties:
        file_id: { type: string }
        kind: { type: string }
        anchor_chunk_no: { type: integer }
        chunks:
          type: array
          items:
            type: object
            properties:
              chunk_no: { type: integer }
              text: { type: string }
              page: { type: integer, nullable: true }
              offset_start: { type: integer, nullable: true }
              offset_end: { type: integer, nullable: true }
    AgentToolsResponse:
      type: object
      properties:
        tools:
          type: array
          items: { type: object }
    AgentInvocation:
      type: object
      required: [name, arguments]
      properties:
        name: { type: string }
        arguments: { type: object }
    FileGroup:
      type: object
      properties:
        file_id: { type: string }
        paths:
          type: array
          items:
            type: object
            properties:
              root_id: { type: string }
              path: { type: string }
        mime: { type: string }
        kind: { type: string }
        score: { type: number }
        chunks:
          type: array
          items: { $ref: '#/components/schemas/Hit' }
    ImageHit:
      type: object
      description: One image candidate returned by the visual search proxy
      properties:
        asset_id:
          type: string
          description: Unique identifier in NimoOS-Photos
        name:
          type: string
          description: Original filename of the image
        path:
          type: string
          description: Absolute path on the NAS
        score:
          type: number
          description: Similarity score from Photos smart-search (0–1)
        taken_at:
          type: string
          description: ISO-8601 timestamp when the photo was taken (omitted if unknown)
          nullable: true
        thumbnail_url:
          type: string
          description: Relative URL to the small thumbnail, e.g. /v1/photos/assets/{id}/thumbnail?size=small
    FileNameHit:
      type: object
      description: One filename-index candidate returned by the filenames source
      properties:
        path:
          type: string
          description: Absolute path on the NAS
        name:
          type: string
          description: Base filename
        ext:
          type: string
          description: Lowercase extension without leading dot (e.g. "pdf")
        size:
          type: integer
          description: File size in bytes
        mtime_ms:
          type: integer
          description: Last-modified timestamp in Unix milliseconds
        is_dir:
          type: boolean
          description: True when the entry is a directory
        match:
          type: number
          description: Relevance score assigned by the tokenize/score algorithm
    AggregateResponse:
      type: object
      description: >
        Aggregated result from the unified nimoos_search tool. Groups candidates
        by source (semantic, filenames, images). A source that is unavailable or
        not requested returns an empty array; a warning string is appended.
      properties:
        groups:
          type: object
          properties:
            semantic:
              type: array
              description: Hits from BGE-M3 semantic vector search (trimmed for LLM context)
              items:
                type: object
            filenames:
              type: array
              description: Hits from the filename full-text index
              items: { $ref: '#/components/schemas/FileNameHit' }
            images:
              type: array
              description: Hits from the Photos smart-search proxy
              items: { $ref: '#/components/schemas/ImageHit' }
        stats:
          type: object
          description: Diagnostic counters (fileindex_status, total_candidates, etc.)
          additionalProperties: true
        warnings:
          type: array
          description: >
            Per-source degradation warnings, e.g. "semantic_unavailable",
            "filenames_unavailable", "images_unavailable".
          items:
            type: string
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    ServiceUnavailable:
      description: Upstream unavailable / not implemented
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              detail: { type: string, nullable: true }
              retry_after: { type: integer, nullable: true }
